services:
  csv-producer:
    image: hw3-csv-producer:latest
    container_name: hw3-csv-producer
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      INPUT_TOPIC: browser-history-visits
    restart: unless-stopped

  domain-statistics-stream:
    image: hw3-domain-statistics-stream:latest
    container_name: hw3-domain-statistics-stream
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      STREAMS_APPLICATION_ID: hw3-domain-statistics
      INPUT_TOPIC: browser-history-visits
      TOP_FIVE_LOG_INTERVAL_MS: 10000
    restart: unless-stopped
