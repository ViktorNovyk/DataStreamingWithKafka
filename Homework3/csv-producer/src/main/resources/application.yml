server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hw3-csv-producer
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:32MB}
      max-request-size: ${MAX_REQUEST_SIZE:32MB}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  input-topic: ${INPUT_TOPIC:browser-history-visits}
  csv:
    max-chars-per-column: ${CSV_MAX_CHARS_PER_COLUMN:131072}
    input-buffer-size: ${CSV_INPUT_BUFFER_SIZE:131072}
